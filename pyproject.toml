[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-hedge-iot"
version = "0.1.0"
description = "Solar production forecasting and battery optimization for the HEDGE-IoT AURORA pilot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyarrow>=16",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]
ml = [
  "scikit-learn>=1.5",
  "torch>=2.9",
  "pytorch-forecasting>=1.8",
  "lightning>=2.6",
  "matplotlib>=3.10",
]
optimization = [
  "cvxpy>=1.5",
]
satellite = [
  "eumdac>=3.0",
  "satpy>=0.55",
  "xarray>=2024.1",
  "zarr>=2.18",
  "fsspec>=2024.2",
  "s3fs>=2024.2",
  "pyresample>=1.28",
  "imagecodecs>=2024.1",
  "netCDF4>=1.6",
  "threadpoolctl>=3.5",
]
nwp = [
  "cfgrib>=0.9.15",
  "eccodes>=2.36",
]

[project.scripts]
aurora = "aurora.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
