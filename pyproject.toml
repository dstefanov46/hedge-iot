[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-hedge-iot"
version = "0.1.0"
description = "Solar production forecasting and battery optimization for the HEDGE-IoT AURORA pilot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]
ml = [
  "scikit-learn>=1.5",
  "torch>=2.9",
  "pytorch-forecasting>=1.8",
  "lightning>=2.6",
  "matplotlib>=3.10",
]
optimization = [
  "cvxpy>=1.5",
]

[project.scripts]
aurora = "aurora.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

